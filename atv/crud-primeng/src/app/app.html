<div class="p-6 max-w-5xl mx-auto font-sans text-slate-200">
  
  <div class="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
    <h2 class="text-2xl font-bold m-0 tracking-wide text-white">Gerenciamento de Itens</h2>
    <p-button label="Novo Item" severity="success" (click)="abrirNovo()"></p-button>
  </div>

  <p-table [value]="itens" [tableStyle]="{ 'min-width': '50rem' }">
    <ng-template pTemplate="header">
      <tr>
        <th class="p-4 font-semibold text-slate-300">Nome</th>
        <th class="p-4 font-semibold text-slate-300">Valor</th>
        <th class="p-4 font-semibold text-slate-300">Status</th>
        <th class="p-4 font-semibold text-slate-300 text-center">Ações</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-item>
      <tr class="border-b border-slate-800">
        <td class="p-4 font-medium text-white">{{ item.nome }}</td>
        <td class="p-4 text-slate-300">{{ item.valor | currency:'BRL' }}</td>
        <td class="p-4">
          <p-tag [severity]="item.disponivel ? 'success' : 'danger'" [value]="item.disponivel ? 'Disponível' : 'Indisponível'"></p-tag>
        </td>
        <td class="p-4 text-center flex justify-center gap-2">
          <p-button label="Editar" severity="info" [text]="true" (click)="editar(item)"></p-button>
          <p-button label="Excluir" severity="danger" [text]="true" (click)="excluir(item.id)"></p-button>
        </td>
      </tr>
    </ng-template>
  </p-table>

  <p-dialog header="Detalhes do Item" [(visible)]="exibirModal" [modal]="true" [style]="{ width: '25rem' }">
    <div class="flex flex-col gap-4 mt-4">
      
      <div class="flex flex-col gap-1">
        <label class="font-medium text-sm text-slate-300">Nome do Produto</label>
        <input pInputText [ngModel]="nome()" (ngModelChange)="nome.set($event)" class="w-full" placeholder="Digite o nome" />
        
        @if (nomeInvalido()) {
          <small class="text-red-400 font-medium mt-1">O nome é obrigatório.</small>
        }
      </div>

      <div class="flex flex-col gap-1">
        <label class="font-medium text-sm text-slate-300">Valor (R$)</label>
        <p-inputNumber [ngModel]="valor()" (ngModelChange)="valor.set($event)" mode="currency" currency="BRL" locale="pt-BR" class="w-full"></p-inputNumber>
        
        @if (valorInvalido()) {
          <small class="text-red-400 font-medium mt-1">Insira um valor maior que zero.</small>
        }
      </div>

      <div class="flex items-center gap-2 mt-2">
        <p-checkbox [ngModel]="disponivel()" (ngModelChange)="disponivel.set($event)" [binary]="true" inputId="status"></p-checkbox>
        <label for="status" class="text-sm text-slate-300 cursor-pointer select-none">Disponível para venda</label>
      </div>

      <p-button label="Salvar Alterações" severity="success" (click)="salvar()" styleClass="w-full mt-4" [disabled]="!formValido()"></p-button>
    </div>
  </p-dialog>
</div>
