<div style="max-width: 600px; margin: 20px auto; font-family: sans-serif;">
  
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    <h2 style="color: #ff2a6d; margin: 0; display: flex; align-items: center; gap: 8px;">📋 Lista de Quests</h2>
    <button (click)="irParaIncluir()" style="background: #ff2a6d; color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: bold;">+ Nova Quest</button>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px;">
    @for (q of quests(); track q.id) {
      @if (q.id !== undefined) {
        <div (click)="irParaDetalhe(q.id)" style="background: white; padding: 15px; border-radius: 12px; border: 2px solid #ffb7d5; display: flex; justify-content: space-between; align-items: center; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
          
          <div>
            <h4 style="margin: 0 0 5px 0; color: #333; font-size: 18px;">{{ q.texto }}</h4>
            <span style="color: #666; font-size: 14px; display: flex; gap: 15px;">
              <span>⭐ {{ q.xp }} XP</span>
              <span [style.color]="q.feita ? '#4caf50' : '#f44336'">
                {{ q.feita ? '✅ Concluída' : '⏳ Pendente' }}
              </span>
            </span>
          </div>

          <button (click)="irParaAlterar(q.id, $event)" style="background: #b39ddb; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold;">Editar</button>
        </div>
      }
    } @empty {
      <div style="text-align: center; padding: 40px; background: #f9f9f9; border-radius: 12px; border: 2px dashed #ccc;">
        <p style="color: #888; font-size: 16px;">Nenhuma quest encontrada.</p>
        <p style="color: #888; font-size: 14px;">Clique em "+ Nova Quest" para começar!</p>
      </div>
    }
  </div>

</div>
